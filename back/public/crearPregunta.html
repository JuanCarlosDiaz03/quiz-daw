<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Pregunta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-primary-subtle">

    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Quiz</a>
            <a href="/" class="btn btn-outline-light btn-sm">
                Tornar al quiz
            </a>
        </div>
    </nav>

    <div class="container py-5">

        <div class="bg-white rounded shadow-sm border p-4 mx-auto" style="max-width: 700px;">

            <h1 class="h3 text-primary mb-2">
                Crear Pregunta
            </h1>

            <p class="text-secondary mb-4">
                Afegeix una nova pregunta al quiz.
            </p>

            <hr>

            <form action="" method="post" id="formCrear">

                <div class="mb-4">
                    <label for="pregunta" class="form-label fw-bold">
                        Pregunta
                    </label>

                    <input
                        type="text"
                        name="pregunta"
                        id="pregunta"
                        class="form-control"
                        placeholder="Afegeix una pregunta nova">
                </div>


                <div class="mb-4">

                    <label for="respostes" class="form-label fw-bold">
                        Respostes
                    </label>

                    <input
                        type="text"
                        name="respostes"
                        id="respostes-1"
                        class="form-control mb-2"
                        placeholder="Posa una resposta">

                    <input
                        type="text"
                        name="respostes"
                        id="respostes-2"
                        class="form-control mb-2"
                        placeholder="Posa una resposta">

                    <input
                        type="text"
                        name="respostes"
                        id="respostes-3"
                        class="form-control mb-2"
                        placeholder="Posa una resposta">

                    <input
                        type="text"
                        name="respostes"
                        id="respostes-4"
                        class="form-control"
                        placeholder="Posa una resposta">

                </div>

                <div class="mb-4">
    <label for="correcta" class="form-label fw-bold">
        Quina resposta és la correcta?
    </label>

    <select name="correcta" id="correcta" class="form-select">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
    </select>
</div>

                <div class="mb-4">

                    <label for="imagen" class="form-label fw-bold">
                        Imagen
                    </label>

                    <input
    type="text"
    name="imatge"
    id="imatge"
    class="form-control"
    placeholder="Ruta de la imagen">

                </div>


                <div class="d-flex justify-content-between">

                    <a href="/admin.html" class="btn btn-secondary">
                        Tornar
                    </a>

                    <input
                        id="enviarPregunta"
                        type="submit"
                        value="Afegir Pregunta"
                        class="btn btn-success">

                </div>

            </form>

        </div>

    </div>


    <div id="idPanelAdmin" class="position-fixed bottom-0 start-0 m-3">

        <a href="/admin.html" class="btn btn-outline-primary btn-sm">
            Panell d'administració
        </a>

    </div>


</body>

<script src="admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
